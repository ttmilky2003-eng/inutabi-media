<h2>ストーリー</h2>
<div class="grid st"><a href="story_1.jpg"><img src="story_1.jpg" loading="lazy" alt=""><span>投稿前</span></a><a href="story_2.jpg"><img src="story_2.jpg" loading="lazy" alt=""><span>投稿後</span></a></div>
<script>
const FEED=["feed_01.jpg", "feed_02.jpg", "feed_03.jpg", "feed_04.jpg", "feed_05.jpg", "feed_06.jpg", "feed_07.jpg", "feed_08.jpg", "feed_09.jpg", "feed_10.jpg", "feed_11.jpg", "feed_12.jpg", "feed_13.jpg", "feed_14.jpg", "feed_15.jpg", "feed_16.jpg", "feed_17.jpg", "feed_18.jpg", "feed_19.jpg"], STORY=["story_1.jpg", "story_2.jpg"];
const files={};
const msg=t=>document.getElementById('msg').textContent=t;
async function load(name){const r=await fetch(name);const b=await r.blob();return new File([b],name,{type:'image/jpeg'});}
(async()=>{
  try{
    for(const n of FEED.concat(STORY)) files[n]=await load(n);
    const test=[files[FEED[0]]];
    if(navigator.canShare && navigator.canShare({files:test})){
      ['all','feed','story'].forEach(id=>document.getElementById(id).disabled=false);
      msg('準備できました。下のボタンを押してください');
    }else{
      document.getElementById('safari').hidden=false;
      msg('この画面では一括保存ができません。Safariで開くか、下の画像を長押しして保存してください');
    }
  }catch(e){msg('画像の読み込みに失敗しました。ページを開き直してください');}
})();
async function share(list){
  try{await navigator.share({files:list.map(n=>files[n])});msg('保存メニューを開きました（「画像を保存」を選んでね）');}
  catch(e){if(e.name!=='AbortError')msg('保存できませんでした：'+e.message);}
}
document.getElementById('all').onclick=()=>share(FEED.concat(STORY));
document.getElementById('feed').onclick=()=>share(FEED);
document.getElementById('story').onclick=()=>share(STORY);
document.getElementById('copy').onclick=async()=>{
  const t=document.getElementById('cap');
  try{await navigator.clipboard.writeText(t.value);msg('キャプションをコピーしました');}
  catch(e){t.focus();t.select();t.setSelectionRange(0,t.value.length);msg('文字を選びました。「コピー」を押してください');}
};
</script>
